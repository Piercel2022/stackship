version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: stackship
      POSTGRES_USER: stackship
      POSTGRES_PASSWORD: stackship123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
    environment:
      - DATABASE_URL=postgres://stackship:stackship123@postgres:5432/stackship?sslmode=disable
      - REDIS_URL=redis://redis:6379

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: