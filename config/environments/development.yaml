server:
  port: 8080
  host: localhost
  cors:
    allowed_origins:
      - http://localhost:3000
      - http://localhost:5173

database:
  host: localhost
  port: 5432
  name: stackship
  user: stackship
  password: stackship123
  ssl_mode: disable
  max_connections: 100

redis:
  host: localhost
  port: 6379
  password: ""
  database: 0

jwt:
  secret: your-super-secret-jwt-key-change-in-production
  expiration: 24h

docker:
  socket_path: /var/run/docker.sock
  registry_url: docker.io

kubernetes:
  config_path: ~/.kube/config
  namespace: stackship

logging:
  level: debug
  format: json
  output: stdout
